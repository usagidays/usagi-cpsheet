:root{--ink:#2F5273;--mute:#4A7BA3}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{padding:12px;display:flex;flex-direction:column;align-items:center;gap:10px;font:300 15px 'Pretendard',sans-serif;color:var(--ink);background:#E6F1FA}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;flex:none}
.btn,.sel{height:44px;border:0;border-radius:22px;background:#ADD4EC;color:var(--ink);font:400 15px 'Pretendard',sans-serif;box-shadow:0 4px 10px rgba(110,160,200,.3);cursor:pointer}
.btn{padding:0 14px;font-size:14px}
.btn.y{background:#FFE9A8}
.btn:disabled{opacity:.5;cursor:default}
.sel{padding:0 14px}
.fl{display:flex;align-items:center;gap:6px;font-size:13px}
.btn:focus-visible,.sel:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#fitbox{flex:none}
#fit{width:1280px;height:840px;transform-origin:0 0}
#sheet{--w0:rgba(255,255,255,0);position:relative;width:1280px;height:840px;padding:24px;font-family:var(--ff,'Pretendard',sans-serif);background:radial-gradient(circle at 12% 8%,#fff,var(--w0) 45%),radial-gradient(circle at 88% 92%,var(--cream),var(--cream0) 50%),linear-gradient(160deg,var(--pale),var(--p2))}
.win{height:100%;border-radius:20px;overflow:hidden;display:flex;flex-direction:column;background:radial-gradient(circle at 82% 14%,var(--cream),var(--cream0) 52%),radial-gradient(circle at 10% 90%,#fff,var(--w0) 45%),linear-gradient(180deg,var(--p1),var(--pale));box-shadow:0 18px 44px rgba(110,160,200,.35)}
.tb{height:56px;display:flex;align-items:flex-end;background:linear-gradient(180deg,var(--p2),var(--pale))}
.dots{display:flex;gap:2px;padding:0 8px 8px 14px}
.dot{position:relative;width:28px;height:28px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.dot i{width:15px;height:15px;border-radius:50%;box-shadow:0 1px 3px rgba(110,160,200,.55)}
.dot input{position:absolute;left:0;top:0;width:100%;height:100%;opacity:0;cursor:pointer;padding:0;border:0}
.tab .ed{max-width:190px;overflow:hidden;white-space:nowrap}
.photo .im.has{cursor:move}
#hint{flex-basis:100%;text-align:center;font-size:12px}
.tab{height:44px;width:250px;padding:0 16px;display:flex;align-items:center;background:#fff;border-radius:12px 12px 0 0;font-weight:400}
.ab{height:44px;display:flex;align-items:center;gap:8px;padding:0 14px;background:rgba(255,255,255,.55)}
.url{flex:1;max-width:520px;margin:0 auto;height:32px;border-radius:16px;background:#fff;box-shadow:0 2px 8px rgba(110,160,200,.2);display:flex;align-items:center;justify-content:center;font-size:14px}
.ct{position:relative;flex:1}
.map{position:absolute;left:32px;top:26px;width:788px;height:640px}
.map svg{position:absolute;left:0;top:0}
.panel{position:absolute;right:32px;top:46px;width:360px;height:600px;padding:22px;border-radius:20px;background:rgba(255,255,255,.8);box-shadow:0 10px 28px rgba(110,160,200,.22);overflow:hidden}
.panel h2{margin:0;font-weight:700;font-size:26px;letter-spacing:.02em;line-height:34px}
.panel small{display:block;margin:2px 0 8px;font-size:12px;color:var(--mute);letter-spacing:.06em;line-height:18px}
.row{position:relative;display:flex;gap:14px;align-items:center}
.th{flex:none;border-radius:16px;background:linear-gradient(135deg,var(--pale),var(--cream)) center/cover;cursor:pointer}
.rt{flex:1;min-width:0}
.nm{font:500 15px/21px var(--fn,'Pretendard',sans-serif)}
.nm em{font-style:normal;font-weight:300;font-size:13px;color:var(--mute);margin-left:8px}
.sm{font-size:13px;line-height:17.5px;overflow:hidden}
.ed{display:inline-block;vertical-align:top;min-width:1em;min-height:1.2em;outline:none;cursor:text}
.ed:empty:before{content:attr(data-ph);color:transparent}
.ed:focus{background:rgba(255,233,168,.55);border-radius:4px}
.ed:empty:hover:before,.ed:empty:focus:before,.guide .ed:empty:before{color:rgba(47,82,115,.42)}
.guide .ed{background:rgba(255,233,168,.3);border-radius:4px}
.node{position:absolute;width:116px;height:140px;transform:scale(var(--s,1));transform-origin:50% 70px}
.pol{position:relative;padding:10px 10px 0;border-radius:4px;background:#fff;box-shadow:0 8px 20px rgba(110,160,200,.3);transform:rotate(var(--r));cursor:grab;user-select:none;touch-action:none}
.pol .ed{user-select:text;cursor:text}
.pol:before{content:'';position:absolute;left:50%;top:-9px;width:58px;height:18px;margin-left:-29px;border-radius:2px;background:var(--sky);opacity:.75;transform:rotate(-3deg)}
.im{width:100%;border-radius:2px;background:linear-gradient(135deg,var(--pale),var(--cream)) center/cover;display:flex;align-items:center;justify-content:center;cursor:pointer}
.im b{font-weight:300;font-size:12px;color:var(--mute);opacity:0}
.guide .im b,.im:hover b{opacity:1}
.im.has b{display:none}
.cap{display:flex;align-items:center;justify-content:center;font:500 16px var(--fn,'Pretendard',sans-serif)}
.cap.big{font-size:19px}
.info{position:absolute;left:50%;top:100%;width:150px;margin:10px 0 0 -75px;text-align:center;font-size:12px;line-height:1.65}
.cinfo{position:absolute;left:50%;top:100%;width:170px;margin:12px 0 0 -85px;text-align:center;font-size:12px;line-height:1.65}
.tg{color:var(--mute);font-weight:400}
.q{font-style:italic}
.kv span{color:var(--mute);margin-right:6px}
.rl{position:absolute;transform:translate(-50%,-50%);padding:3px 13px;border-radius:12px;background:rgba(255,255,255,.9);font-size:12px;letter-spacing:.04em;cursor:grab}
.rl .ed{cursor:text}
.guide .rl:after{content:'';position:absolute;right:-3px;top:50%;width:8px;height:8px;margin-top:-4px;border-radius:50%;background:var(--sky)}
.x{position:absolute;right:-8px;top:-8px;z-index:2;width:22px;height:22px;padding:0;border:0;border-radius:50%;background:#fff;box-shadow:0 1px 5px rgba(110,160,200,.5);color:var(--ink);font:14px/22px sans-serif;cursor:pointer;opacity:0}

.x.rx{right:-8px;top:4px}

const UNI={"1":[[551,112,0,0.5]],"2":[[585,127,0,0.6],[203,450,0,0.6]],"3":[[653,158,0,0.8],[437,516,0,0.8],[92,209,0,0.8]],"4":[[585,127,0,0.6],[642,412,0,0.6],[203,450,0,0.6],[146,165,0,0.6]],"5":[[394,68,0,0.5],[707,225,0,0.5],[588,480,0,0.5],[200,480,0,0.5],[81,225,0,0.5]],"6":[[394,60,0,0.6],[686,179,0,0.6],[686,418,0,0.6],[394,537,0,0.6],[102,418,0,0.6],[102,179,0,0.6]],"7":[[453,62,0,0.6],[691,184,0,0.6],[706,393,0,0.6],[486,531,0,0.6],[196,495,0,0.6],[56,311,0,0.6],[170,118,0,0.6]],"8":[[394,60,0,0.6],[632,130,0,0.6],[731,299,0,0.6],[632,467,0,0.6],[394,537,0,0.6],[156,467,0,0.6],[57,299,0,0.6],[156,130,0,0.6]],"9":[[394,57,0,0.6],[613,113,0,0.6],[729,258,0,0.6],[688,421,0,0.6],[510,528,0,0.6],[278,528,0,0.6],[100,421,0,0.6],[59,258,0,0.6],[175,113,0,0.6]],"10":[[394,55,0,0.6],[595,102,0,0.6],[719,225,0,0.6],[719,376,0,0.6],[595,499,0,0.6],[394,546,0,0.6],[193,499,0,0.6],[69,376,0,0.6],[69,225,0,0.6],[193,102,0,0.6]]};
const SU=[null, 1, 1, 0.82, 1, 0.78, 0.68, 0.66, 0.68, 0.64, 0.62];
function uniform(){const v=UNI[S.p.length];if(v)S.p.forEach((o,i)=>{o.x=v[i][0];o.y=v[i][1];o.bend=0;o.lt=v[i][3]});S.so=SU[S.p.length]||null;S.mode='uni';S.moved=false}
function relayout(){S.mode==='uni'?uniform():autoLayout()}
function autoLayout(){S.so=null;S.mode='preset';const V=PRESETS[S.p.length]||[],v=V[S.seed%V.length];if(v)S.p.forEach((o,i)=>{o.x=v[i][0];o.y=v[i][1];o.bend=v[i][2];o.lt=v[i][3]});S.moved=false}
function place(i){
  const s=curS(),oth=S.p.filter((_,j)=>j!=i).map(o=>[o.x,o.y]).concat([[CX,CYC+40]]);
  let best=[CX,CYC],bd=-1;
  for(let x=75*s+6;x<=MW-75*s-6;x+=14)for(let y=79*s+6;y<=MH-136*s-6;y+=14){
    const d=Math.min(...oth.map(o=>Math.hypot((o[0]-x)/150,(o[1]-y)/215)));if(d>bd){bd=d;best=[x,y]}
  }
  S.p[i].x=Math.round(best[0]);S.p[i].y=Math.round(best[1]);
}
function geo(i){
  const o=S.p[i],s=curS(),dx=o.x-CX,dy=o.y-CYC,d=Math.hypot(dx,dy)||1,ux=dx/d,uy=dy/d,ax=Math.abs(ux)||1e-6,ay=Math.abs(uy)||1e-6;
  const e1=Math.min(66*CS/ax,80*CS/ay),e2=Math.min(58*s/ax,70*s/ay);
  const sx=CX+ux*e1,sy=CYC+uy*e1,ex=o.x-ux*e2,ey=o.y-uy*e2,off=bendOf(o,i);
  const cx0=(sx+ex)/2,cy0=(sy+ey)/2,qx=cx0-uy*off,qy=cy0+ux*off;
  const t=o.lt!=null?o.lt:.5,A=(1-t)*(1-t),Bq=2*t*(1-t),Cq=t*t;
  return{path:`M${sx} ${sy}Q${qx} ${qy} ${ex} ${ey}`,mx:A*sx+Bq*qx+Cq*ex,my:A*sy+Bq*qy+Cq*ey,cx0,cy0,ux,uy};
}
function updateLines(){
  const lc=mix(S.t.sky,'#3F6F9A',.28);let svg='';
  S.p.forEach((o,i)=>{
    const g=geo(i);svg+=`<path d="${g.path}" fill="none" stroke="${lc}" stroke-width="1"/>`;
    const el=document.querySelector(`.rl[data-i="${i}"]`);if(el){el.style.left=g.mx+'px';el.style.top=g.my+'px'}
  });
  $('#lines').innerHTML=svg;
}
const HINT='인물을 끌어 자유롭게 배치 · 관계 라벨 옆 여백을 끌면 선이 휘어요';
function render(){
  const n=S.p.length,rot=[-3,2,3,-2,2,-3,3,-2],scl=curS();
  let nodes='',lbl='',rows='';
  S.p.forEach((o,i)=>{
    lbl+=`<div class="rl" data-i="${i}" title="양옆 여백을 끌면 선이 휘어요">${ed(i+'.rel','관계')}</div>`;
    nodes+=`<div class="node" data-i="${i}" style="left:${o.x-58}px;top:${o.y-70}px;--r:${rot[i%8]}deg;--s:${scl}"><div class="pol"><div class="im" data-img="${i}" style="height:96px"><b>+ 사진</b></div><div class="cap" style="height:34px">${ed(i+'.name','이름')}</div></div><div class="info"><div class="tg">${ed(i+'.tags','#태그 #태그')}</div><div class="kv"><span>호칭</span>${ed(i+'.call','호칭')}</div><div class="q">${ed(i+'.catch','캐치프레이즈')}</div></div><button class="x" data-del="${i}" aria-label="인물 삭제" data-html2canvas-ignore>×</button></div>`;
  });
  const rh=Math.min(84,Math.floor(494/Math.max(n,1))),ts=Math.min(58,rh-12),ml=Math.max(1,Math.floor((rh-22)/17.5));
  S.p.forEach((o,i)=>{
    rows+=`<div class="row" style="height:${rh}px">${S.thumb?`<div class="th" data-img="${i}" style="width:${ts}px;height:${ts}px"></div>`:''}<div class="rt"><div class="nm">${ed(i+'.name','이름')}<em>${ed(i+'.rel','관계')}</em></div><div class="sm" style="max-height:${ml*17.5}px">${ed(i+'.sum','관계를 한 줄로')}</div></div><button class="x rx" data-del="${i}" aria-label="인물 삭제" data-html2canvas-ignore>×</button></div>`;
  });
  const center=`<div class="node" style="left:${CX-66}px;top:${CYC-80}px;width:132px;height:160px;--r:-2deg;--s:${CS};transform-origin:50% 80px"><div class="pol"><div class="im" data-img="c" style="height:112px"><b>+ 사진</b></div><div class="cap big" style="height:38px">${ed('c.name','이름')}</div></div><div class="cinfo"><div class="q">${ed('c.quote','한 줄 소개')}</div><div class="tg">${ed('c.tags','#태그 #태그')}</div></div></div>`;
  $('#map').innerHTML=`<svg id="lines" width="${MW}" height="640"></svg>`+center+nodes+lbl;
  $('#panel').innerHTML=`<h2>${ed('c.ptitle','제목')}</h2><small>${ed('c.psub','부제')}</small>${rows}`;
  $('#url').innerHTML=ed('c.url','링크 입력');
  $('#tab').innerHTML=ed('c.tab','탭 제목')+'<span style="margin-left:10px">×</span>';
  updateLines();applyImgs();
  $('#add').disabled=n>=10;
}
function applyImgs(){
  document.querySelectorAll('[data-img]').forEach(e=>{
    const o=own(e.dataset.img);
    if(o.img){
      const r=o.iw/o.ih,z=o.z||1;
      e.style.backgroundImage=`url(${o.img})`;e.style.backgroundRepeat='no-repeat';
      e.style.backgroundSize=`${(r>=1?r:1)*z*100}% ${(r>=1?1:1/r)*z*100}%`;
      e.style.backgroundPosition=`${o.px}% ${o.py}%`;
    }else{e.style.backgroundImage='';e.style.backgroundSize='';e.style.backgroundPosition=''}
    e.classList.toggle('has',!!o.img);
  });
}
let K=1;
function fit(){
  K=Math.min(1,(innerWidth-24)/1280,(innerHeight-$('.bar').offsetHeight-34)/840);
  $('#fit').style.transform=`scale(${K})`;$('#fitbox').style.width=1280*K+'px';$('#fitbox').style.height=840*K+'px';
}

document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.t){S.t[t.dataset.t]=t.value;theme();updateLines();return}
  const ce=t.closest&&t.closest('.ed');if(!ce)return;
  const k=ce.dataset.k,v=ce.textContent;set(k,v);
  document.querySelectorAll(`[data-k="${k}"]`).forEach(o=>{if(o!==ce)o.textContent=v});
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('ed')){e.preventDefault();e.target.blur()}});
document.addEventListener('paste',e=>{
  if(!(e.target.classList&&e.target.classList.contains('ed')))return;
  e.preventDefault();document.execCommand('insertText',false,(e.clipboardData.getData('text')||'').replace(/\n/g,' '));
});

/* 드래그: 인물 이동 / 선 휘기 / 사진 위치 조정 */
let drag=null,pan=null,bend=null,justDragged=false;
const sup=()=>{justDragged=true;setTimeout(()=>justDragged=false,0)};
document.addEventListener('pointerdown',e=>{
  if(e.button!==0||e.target.closest('.ed')||e.target.closest('.x'))return;
  const rl=e.target.closest('.rl');
  if(rl){e.preventDefault();bend={i:+rl.dataset.i,moved:false};return}
  const im=e.target.closest('.im[data-img]');
  if(photoMode&&im&&own(im.dataset.img).img){e.preventDefault();pan={o:own(im.dataset.img),sx:e.clientX,sy:e.clientY,px:own(im.dataset.img).px,py:own(im.dataset.img).py,fw:im.offsetWidth,moved:false};return}
  const pol=e.target.closest('.node[data-i] .pol');if(!pol)return;
  const i=+pol.closest('.node').dataset.i;
  drag={i,sx:e.clientX,sy:e.clientY,ox:S.p[i].x,oy:S.p[i].y,moved:false,el:pol.closest('.node')};
});
document.addEventListener('pointermove',e=>{
  if(bend){
    const r=$('#map').getBoundingClientRect(),g=geo(bend.i);
    const d=((e.clientX-r.left)/K-g.cx0)*(-g.uy)+((e.clientY-r.top)/K-g.cy0)*g.ux;
    S.p[bend.i].bend=Math.max(-170,Math.min(170,Math.round(2*d)));bend.moved=true;updateLines();return;
  }
  if(pan){
    const dx=(e.clientX-pan.sx)/K,dy=(e.clientY-pan.sy)/K,o=pan.o,r=o.iw/o.ih,z=o.z||1;
    const ex=pan.fw*(1-(r>=1?r:1)*z),ey=pan.fw*(1-(r>=1?1:1/r)*z);
    if(Math.hypot(dx,dy)>2)pan.moved=true;
    if(ex<-.5)o.px=Math.max(0,Math.min(100,pan.px+dx*100/ex));
    if(ey<-.5)o.py=Math.max(0,Math.min(100,pan.py+dy*100/ey));
    applyImgs();return;
  }
  if(!drag)return;
  const dx=(e.clientX-drag.sx)/K,dy=(e.clientY-drag.sy)/K;
  if(!drag.moved&&Math.hypot(dx,dy)<4)return;
  drag.moved=true;
  const o=S.p[drag.i];
  o.x=Math.round(Math.max(50,Math.min(MW-50,drag.ox+dx)));o.y=Math.round(Math.max(60,Math.min(520,drag.oy+dy)));
  drag.el.style.left=(o.x-58)+'px';drag.el.style.top=(o.y-70)+'px';
  updateLines();
});
document.addEventListener('pointerup',()=>{
  if(bend){if(bend.moved)sup();bend=null}
  if(pan){if(pan.moved)sup();pan=null}
  if(drag&&drag.moved){S.moved=true;sup()}
  drag=null;
});
document.addEventListener('wheel',e=>{
  if(!photoMode)return;
  const im=e.target.closest&&e.target.closest('.im[data-img]');if(!im)return;
  const o=own(im.dataset.img);if(!o.img)return;
  e.preventDefault();o.z=Math.max(1,Math.min(4,(o.z||1)*Math.exp(-e.deltaY*.0015)));applyImgs();
},{passive:false});

let cur=null;
document.addEventListener('click',e=>{
  if(justDragged)return;
  const d=e.target.closest('[data-del]');
  if(d){S.p.splice(+d.dataset.del,1);if(!S.moved)relayout();render();return}
  const t=e.target.closest('[data-img]');
  if(t){if(photoMode&&t.classList.contains('im')&&own(t.dataset.img).img)return;cur=t.dataset.img;$('#f').click()}
});
$('#f').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f||cur===null)return;
  const r=new FileReader();
  r.onload=()=>{const im=new Image();im.onload=()=>{
    const sc=Math.min(1,700/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=im.width*sc;c.height=im.height*sc;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);
    const o=own(cur);o.img=c.toDataURL('image/jpeg',.9);o.iw=c.width;o.ih=c.height;o.z=1;o.px=50;o.py=50;applyImgs();};im.src=r.result};
  r.readAsDataURL(f);e.target.value='';
});
$('#add').onclick=()=>{if(S.p.length>=10)return;S.p.push(mk('NPC','관계'));if(S.moved)place(S.p.length-1);else relayout();render()};
$('#auto').onclick=()=>{S.seed++;autoLayout();render()};
$('#even').onclick=()=>{uniform();render()};
$('#photo').onclick=()=>{photoMode=!photoMode;$('#sheet').classList.toggle('photo',photoMode);$('#photo').textContent='사진 위치 조정: '+(photoMode?'켜짐':'꺼짐');$('#hint').textContent=photoMode?'사진을 끌어 위치 이동 · 마우스 휠로 확대/축소':HINT;fit()};
$('#thumb').onclick=()=>{S.thumb=!S.thumb;$('#thumb').textContent='Relationship 사진: '+(S.thumb?'켜짐':'꺼짐');render()};
$('#guide').onclick=()=>{const on=$('#sheet').classList.toggle('guide');$('#guide').textContent='입력칸 표시: '+(on?'켜짐':'꺼짐')};
['ff','fn'].forEach(id=>{
  const s=$('#'+id);s.innerHTML=FONTS.map(f=>`<option value="${f[1]}">${f[0]}</option>`).join('');
  s.onchange=()=>{S.f[id]=s.value;fonts()};
});
$('#save').onclick=async()=>{
  if(document.activeElement)document.activeElement.blur();
  try{
    await document.fonts.ready;
    const cv=await html2canvas($('#sheet'),{scale:2,backgroundColor:S.t.pale,useCORS:true,logging:false,windowWidth:1400,windowHeight:900,
      onclone:d=>{
        const b=d.body;b.style.overflow='visible';b.style.height='auto';b.style.padding='0';d.documentElement.style.overflow='visible';d.documentElement.style.height='auto';
        d.getElementById('fit').style.transform='none';const fb=d.getElementById('fitbox');fb.style.width='1280px';fb.style.height='840px';
        d.getElementById('sheet').classList.remove('guide','photo');
      }});
    const a=document.createElement('a');a.download='cp-sheet.png';a.href=cv.toDataURL('image/png');a.click();
  }catch(err){alert('이미지 저장에 실패했어요. 인터넷에 연결된 상태인지 확인해 주세요. ('+err.message+')')}
};
addEventListener('resize',fit);
theme();fonts();autoLayout();render();$('#hint').textContent=HINT;fit();
if(document.fonts)document.fonts.ready.then(fit);
